<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Redirecting…</title></head>
<body><p id="message">Redirecting…</p><script src="config.js"></script><script>
(async()=>{
  const message=document.getElementById("message");
  try {
    const r=await fetch(window.GO_CONFIG.WORKER_BASE_URL+"/api/destination",{cache:"no-store"});
    if(!r.ok) throw new Error("Worker API unavailable");
    const data=await r.json();
    const target=new URL(data.url);
    if(target.protocol!=="https:") throw new Error("Invalid destination");
    location.replace(target.href);
  } catch(e) {
    message.textContent="Redirect temporarily unavailable. Please try again later.";
  }
})();
</script></body></html>
